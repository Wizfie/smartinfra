<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAli" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="cardShadowAli" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGradAli)" rx="16"/>

  <g opacity="0.06" stroke="#ea580c" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
  </g>

  <!-- Badges -->
  <rect x="40" y="32" width="180" height="28" rx="14" fill="#ea580c" opacity="0.12"/>
  <text x="54" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ea580c">
    ALIBABA CLOUD ECS
  </text>

  <rect x="230" y="32" width="180" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="244" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">
    Jakarta &amp; Global Cloud
  </text>

  <!-- Illustration Card -->
  <g transform="translate(150, 95)" filter="url(#cardShadowAli)">
    <rect width="300" height="230" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <rect x="35" y="35" width="230" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="55" cy="56" r="4.5" fill="#ea580c"/>
    <circle cx="70" cy="56" r="4.5" fill="#10b981"/>
    <rect x="90" y="52" width="80" height="8" rx="4" fill="#94a3b8" opacity="0.5"/>
    <text x="180" y="60" font-family="monospace" font-size="10" font-weight="700" fill="#ea580c">ECS Enterprise</text>

    <rect x="35" y="90" width="230" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="55" cy="111" r="4.5" fill="#ea580c"/>
    <circle cx="70" cy="111" r="4.5" fill="#10b981"/>
    <rect x="90" y="107" width="80" height="8" rx="4" fill="#94a3b8" opacity="0.5"/>
    <text x="195" y="115" font-family="monospace" font-size="10" font-weight="700" fill="#0284c7">Multi-Core</text>

    <rect x="35" y="145" width="230" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="55" cy="166" r="4.5" fill="#ea580c"/>
    <circle cx="70" cy="166" r="4.5" fill="#10b981"/>
    <rect x="90" y="162" width="80" height="8" rx="4" fill="#94a3b8" opacity="0.5"/>
    <text x="180" y="170" font-family="monospace" font-size="10" font-weight="700" fill="#64748b">ESSD Storage</text>
  </g>
</svg>
